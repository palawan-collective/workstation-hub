services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: dash.merqato.digital,work.merqato.digital,home.merqato.digital
    volumes:
      - /opt/homepage/config:/app/config
    ports:
      - "3003:3000"
    restart: unless-stopped

  dockerproxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: dockerproxy
    environment:
      CONTAINERS: 1
      INFO: 1
      VERSION: 1
      NETWORKS: 0
      IMAGES: 0
      VOLUMES: 0
      EXEC: 0
      POST: 0
      ALLOW_START: 0
      ALLOW_STOP: 0
      ALLOW_RESTARTS: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose:
      - "2375"
    restart: unless-stopped

  hubapi:
    image: python:3.12-alpine
    container_name: hubapi
    command: ["python", "-u", "/app/hub.py"]
    volumes:
      - /opt/homepage/hub:/app:ro
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
      GITHUB_ACCOUNTS: ${GITHUB_ACCOUNTS:-palawan-collective}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      INVENTORY_REPO: ${INVENTORY_REPO:-palawan-collective/projects}
      VERCEL_TOKEN: ${VERCEL_TOKEN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      ALERT_KEY: ${ALERT_KEY}
      ALERT_TO: ${ALERT_TO}
      ALERT_FROM: ${ALERT_FROM}
      CACHE_TTL: ${CACHE_TTL:-60}
      PROBE_TIMEOUT: ${PROBE_TIMEOUT:-20}
      FIRST_BUILD_WAIT: ${FIRST_BUILD_WAIT:-25}
      DOCKER_API: http://dockerproxy:2375
      COOLIFY_URL: ${COOLIFY_URL}
      COOLIFY_TOKEN: ${COOLIFY_TOKEN}
    ports:
      - "3010:3010"
    depends_on:
      - dockerproxy
    restart: unless-stopped

  files:
    image: nginx:alpine
    container_name: hub-files
    volumes:
      - /opt/homepage/static:/usr/share/nginx/html:ro
      - /opt/homepage/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3004:80"
    restart: unless-stopped

  # MerQato Workstation UI + Quick Links Manager (stdlib Python, no framework)
  workstation:
    image: python:3.12-alpine
    container_name: workstation
    command: ["python", "-u", "/app/server.py"]
    volumes:
      - /opt/homepage/app:/app:ro
      - /opt/homepage/data:/data
    environment:
      WS_PORT: "3005"
      WS_DATA_DIR: /data
      WS_STATIC_DIR: /app/static
      WS_ADMIN_USER: ${WS_ADMIN_USER:-david@merqato.digital}
      WS_ADMIN_PASSWORD: ${WS_ADMIN_PASSWORD:?set WS_ADMIN_PASSWORD in .env}
      HUB_URL: http://host.docker.internal:3010
    ports:
      - "3005:3005"
    restart: unless-stopped
